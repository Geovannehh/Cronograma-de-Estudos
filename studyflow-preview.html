<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyFlow — organize seus estudos</title>
  <meta name="theme-color" content="#ffffff">
  <style>
/* StudyFlow — tema escuro tecnológico, estilo glass */
:root {
  color-scheme: light;
  --bg: #ffffff; --bg2: #f6f7f9; --panel: #f6f7f9; --panel2: #eceef2;
  --line: #e8e9ec; --text: #0a0a0a; --muted: #777a80;
  --accent: #2f6bed; --accent2: #4a86e8; --steel: #4a6fa5; --indigo: #4e6bb5;
  --good: #1c8f88; --warn: #b47a12; --bad: #d64550;
  --r: 14px; --shadow: 0 10px 30px rgba(20,30,60,.12);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
h1, h2, h3, h4, p { margin: 0; }
[hidden] { display: none !important; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,.16); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }

.bg-glow { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(600px 400px at 85% -5%, rgba(47,107,237,.10), transparent 70%),
              radial-gradient(500px 360px at -5% 105%, rgba(74,111,165,.08), transparent 70%); }
.app { position: relative; z-index: 1; display: flex; height: 100vh; }

/* sidebar */
.sidebar { width: 220px; flex: none; padding: 18px 12px; display: flex; flex-direction: column; gap: 14px; border-right: 1px solid var(--line); background: rgba(255,255,255,.86); backdrop-filter: blur(18px); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-size: 18px; letter-spacing: -.02em; }
.brand b { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 4px 14px rgba(47,107,237,.35); }
#nav { display: flex; flex-direction: column; gap: 2px; }
.nav-btn { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--muted); text-align: left; transition: .15s; }
.nav-btn:hover { background: var(--panel); color: var(--text); }
.nav-btn.on { background: var(--panel2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.nav-btn .ic { width: 22px; text-align: center; }
.nav-btn .badge { margin-left: auto; background: var(--accent); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 99px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.mini-timer { padding: 10px 12px; border-radius: var(--r); background: var(--panel2); border: 1px solid var(--line); cursor: pointer; }
.mini-timer .t { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mini-timer .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

/* topbar */
.main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.86); backdrop-filter: blur(18px); }
.grow { flex: 1; }
.board-picker { display: flex; align-items: center; gap: 6px; }
.board-picker select { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 600; max-width: 240px; }
.search { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; width: 220px; outline: none; }
.search:focus, input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,107,237,.2); outline: none; }
.view { flex: 1; min-height: 0; overflow: auto; padding: 20px; }

/* botões e campos */
.primary { background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 10px; font-weight: 600; box-shadow: 0 6px 16px rgba(47,107,237,.28); transition: .15s; }
.primary:hover { transform: translateY(-1px); filter: brightness(1.1); }
.ghost { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); text-align: left; transition: .15s; }
.ghost:hover { color: var(--text); background: var(--panel); }
.danger { color: var(--bad); border: 1px solid rgba(251,113,133,.35); padding: 8px 12px; border-radius: 10px; }
.danger:hover { background: rgba(251,113,133,.1); }
.icon { width: 28px; height: 28px; border-radius: 8px; color: var(--muted); }
.icon:hover { background: var(--panel2); color: var(--text); }
input[type=text], input[type=date], input[type=time], input[type=number], select, textarea, .field {
  width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
textarea { resize: vertical; min-height: 90px; }
label.lbl { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin: 12px 0 5px; }
select option { background: #fff; color: #0a0a0a; }

/* quadro kanban */
.board { display: flex; gap: 14px; align-items: flex-start; height: 100%; padding-bottom: 8px; }
.col { width: 290px; flex: none; max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.col > header { display: flex; align-items: center; gap: 8px; padding: 2px 4px 10px; }
.col h3 { font-size: 13px; letter-spacing: .02em; flex: 1; }
.col .count { font-size: 11px; color: var(--muted); background: var(--panel2); padding: 1px 8px; border-radius: 99px; }
.col.done-col h3::after { content: " ✓"; color: var(--good); }
.cards { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 20px; padding: 2px; flex: 1; }
.cards.over { background: rgba(47,107,237,.08); border-radius: 10px; }
.add { margin-top: 8px; padding: 9px; border-radius: 10px; color: var(--muted); text-align: left; transition: .15s; }
.add:hover { background: var(--panel2); color: var(--text); }
.add-col { width: 230px; border: 1px dashed var(--line); background: transparent; min-height: 48px; justify-content: center; color: var(--muted); }
.add-col:hover { border-color: var(--accent); color: var(--text); }
.inline-add { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.card { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; cursor: grab; box-shadow: 0 1px 2px rgba(20,30,60,.05); transition: border-color .15s, transform .15s; }
.card:hover { border-color: rgba(47,107,237,.6); transform: translateY(-1px); }
.card.dragging { opacity: .35; }
.card.done .ttl { text-decoration: line-through; color: var(--muted); }
.card .ttl { font-weight: 600; margin: 6px 0 8px; word-break: break-word; }
.card .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--panel2); color: var(--muted); white-space: nowrap; }
.chip.subj { color: #fff; }
.chip.late { background: rgba(251,113,133,.18); color: var(--bad); }
.chip.soon { background: rgba(251,191,36,.16); color: var(--warn); }
.chip.ok { background: rgba(52,211,153,.14); color: var(--good); }
.prio { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.p1 { background: #9a9c9f; } .p2 { background: var(--accent2); } .p3 { background: var(--warn); } .p4 { background: var(--bad); }
.progress { height: 4px; border-radius: 4px; background: var(--panel2); overflow: hidden; margin-top: 8px; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

/* cronograma */
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar h2 { font-size: 18px; margin-right: 8px; }
.week { display: grid; grid-template-columns: 52px repeat(7, minmax(110px, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel); min-width: 860px; }
.week .head { padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); background: #f6f7f9; }
.week .head.today { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.week .head b { display: block; font-size: 16px; color: var(--text); }
.hours div { height: 48px; font-size: 11px; color: var(--muted); text-align: right; padding: 2px 8px 0 0; border-top: 1px solid var(--line); }
.daycol { position: relative; border-left: 1px solid var(--line); cursor: cell;
  background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 48px; }
.daycol.today { background-color: rgba(47,107,237,.05); }
.block { position: absolute; left: 4px; right: 4px; border-radius: 9px; padding: 5px 8px; font-size: 12px; overflow: hidden; cursor: pointer; color: #fff; box-shadow: var(--shadow); border-left: 3px solid rgba(255,255,255,.55); }
.block small { display: block; opacity: .85; }
.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--bad); z-index: 3; pointer-events: none; }
.scroll-x { overflow-x: auto; }

/* pomodoro */
.pomo { max-width: 560px; margin: 10px auto; text-align: center; }
.modes { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 20px; }
.modes button { padding: 7px 14px; border-radius: 9px; color: var(--muted); }
.modes button.on { background: var(--panel2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.ring { position: relative; width: 280px; height: 280px; margin: 0 auto 18px; }
.ring svg { transform: rotate(-90deg); }
.ring .time { position: absolute; inset: 0; display: grid; place-content: center; }
.ring .time b { font-size: 60px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ring .time span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
.pomo .controls { display: flex; gap: 10px; justify-content: center; margin: 14px 0 22px; }
.pomo .controls .primary { padding: 12px 34px; font-size: 15px; }
.dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--panel2); }
.dots i.on { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.presets { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; text-align: left; }

/* eisenhower */
.matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; height: calc(100% - 50px); min-height: 460px; }
.quad { display: flex; flex-direction: column; border-radius: var(--r); border: 1px solid var(--line); padding: 12px; background: var(--panel); min-height: 0; }
.quad h3 { font-size: 14px; } .quad p { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.quad .cards { flex: 1; }
.q1 { box-shadow: inset 0 2px 0 var(--bad); } .q2 { box-shadow: inset 0 2px 0 var(--good); }
.q3 { box-shadow: inset 0 2px 0 var(--warn); } .q4 { box-shadow: inset 0 2px 0 #9a9c9f; }

/* revisão */
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
.tabs button { padding: 7px 14px; border-radius: 9px; color: var(--muted); }
.tabs button.on { background: var(--panel2); color: var(--text); }
.review-card { max-width: 640px; margin: 0 auto 16px; }
.flash { max-width: 560px; margin: 0 auto 20px; min-height: 220px; display: grid; place-content: center; text-align: center; padding: 28px; font-size: 20px; border-radius: 20px; background: linear-gradient(160deg, rgba(47,107,237,.18), rgba(74,134,232,.08)); border: 1px solid var(--line); }
.flash small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
.rate { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.rate button { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.rate .again:hover { background: rgba(251,113,133,.15); } .rate .hard:hover { background: rgba(251,191,36,.15); } .rate .good:hover { background: rgba(52,211,153,.15); }
.list-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; background: var(--panel); }
.list-item .grow { min-width: 0; }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }

/* progresso */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { padding: 16px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); }
.stat b { display: block; font-size: 28px; letter-spacing: -.02em; } .stat span { color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; margin-top: 12px; }
.bars div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; font-size: 10px; color: var(--muted); }
.bars i { width: 100%; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--accent), var(--accent2)); min-height: 2px; }
.hbar { margin: 10px 0; } .hbar .t { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.hbar .b { height: 8px; border-radius: 8px; background: var(--panel2); overflow: hidden; } .hbar .b i { display: block; height: 100%; border-radius: 8px; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); grid-auto-columns: 14px; gap: 4px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; }
.heat i { border-radius: 4px; background: var(--panel2); }
.heat .l1 { background: rgba(47,107,237,.35); } .heat .l2 { background: rgba(47,107,237,.6); } .heat .l3 { background: rgba(47,107,237,.85); } .heat .l4 { background: var(--accent2); }

/* métodos */
.methods { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.method { padding: 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 8px; transition: .15s; }
.method:hover { border-color: rgba(47,107,237,.5); transform: translateY(-2px); }
.method h3 { display: flex; align-items: center; gap: 8px; font-size: 16px; } .method .em { font-size: 22px; }
.method .tag { color: var(--muted); }
.method ol { margin: 0; padding-left: 18px; color: #3b3d44; } .method li { margin: 3px 0; }
.method .when { font-size: 12px; color: var(--accent2); }
.method .actions { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; padding-top: 6px; }
.hero { padding: 18px 20px; border-radius: var(--r); margin-bottom: 16px; border: 1px solid var(--line); background: linear-gradient(120deg, rgba(47,107,237,.22), rgba(74,134,232,.1)); }
.hero h2 { margin-bottom: 4px; }

/* modal */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(20,25,40,.45); backdrop-filter: blur(6px); animation: fade .15s; }
.modal { width: min(680px, 100%); max-height: 92vh; overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); animation: pop .18s; }
.modal.sm { width: min(440px, 100%); }
.modal h2 { font-size: 18px; margin-bottom: 4px; }
.modal .title-in { font-size: 18px; font-weight: 600; background: transparent; border: 0; padding: 4px 0; }
.modal .foot { display: flex; gap: 8px; justify-content: space-between; margin-top: 18px; }
.modal .foot .r { display: flex; gap: 8px; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.flags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.flag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 99px; border: 1px solid var(--line); cursor: pointer; user-select: none; color: var(--muted); }
.flag input { accent-color: var(--accent); } .flag:has(input:checked) { color: var(--text); border-color: var(--accent); background: rgba(47,107,237,.15); }
.check { display: flex; align-items: center; gap: 8px; padding: 6px 0; } .check input { accent-color: var(--accent); width: 16px; height: 16px; }
.check span { flex: 1; } .check.d span { text-decoration: line-through; color: var(--muted); }
.panel { display: none; } .panel.on { display: block; }
.hint { color: var(--muted); font-size: 12px; margin-top: 4px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: #0a0a0a; color: #fff; border: 1px solid #0a0a0a; padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow); transition: .25s; z-index: 80; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@keyframes fade { from { opacity: 0; } } @keyframes pop { from { opacity: 0; transform: scale(.97) translateY(6px); } }

@media (max-width: 860px) {
  body { overflow: auto; }
  .app { flex-direction: column; height: auto; min-height: 100vh; }
  .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 8px; overflow-x: auto; position: sticky; top: 0; z-index: 20; }
  .brand-name, .side-foot, .nav-btn .lbl { display: none; }
  #nav { flex-direction: row; } .mini-timer { display: none; }
  .topbar { flex-wrap: wrap; } .search { width: 100%; order: 5; }
  .view { overflow: visible; } .board { overflow-x: auto; }
  .matrix { grid-template-columns: 1fr; } .cols2, .cols3 { grid-template-columns: 1fr; }
}

/* ajustes de tema claro (paleta Tola) */
.nav-btn.on { background: #eef3fc; color: var(--accent); box-shadow: none; }
.nav-btn .badge { background: var(--accent); }
.card:hover { box-shadow: 0 8px 22px rgba(20,30,60,.10); }
.col { background: var(--panel); }
.cards.over { background: rgba(47,107,237,.07); }
.chip.subj { color: inherit; }
.hero { background: linear-gradient(120deg, #eef3fc, #f6f7f9); }
.hero p { color: #3b3d44 !important; }
.flash { background: linear-gradient(160deg, #eef3fc, #f6f7f9); }
.modal .tabs, .tabs { background: var(--panel); }
.tabs button.on, .modes button.on { background: #fff; box-shadow: 0 1px 3px rgba(20,30,60,.12); }
.toast { box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.heat .l4 { background: var(--steel); }

.modal .title-in { width: 100%; outline: none; box-shadow: none; }
.modal .title-in:focus { box-shadow: none; }

</style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="logo">⚡</span><span class="brand-name">Study<b>Flow</b></span></div>
      <nav id="nav"></nav>
      <div id="miniTimer" class="mini-timer" hidden></div>
      <div class="side-foot">
        <button class="ghost" data-act="export">⬇ Exportar</button>
        <button class="ghost" data-act="import">⬆ Importar</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="board-picker" id="boardPicker"></div>
        <div class="grow"></div>
        <input id="search" class="search" type="search" placeholder="Buscar cartões ( / )" autocomplete="off">
        <button class="primary" data-act="quick-add">＋ Cartão</button>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>

  <script>
/* StudyFlow — camada de dados (estado, persistência, helpers) */
const Store = (() => {
  const KEY = 'studyflow.v1';
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => iso(new Date());
  const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  const INTERVALS = [1, 2, 4, 8, 16, 32, 64]; // dias por estágio (Leitner / espaçada)
  const COLORS = ['#4a6fa5', '#2f6bed', '#4e6bb5', '#4a86e8', '#777777', '#1c8f88', '#9a9c9f', '#0a0a0a'];
  // migra cores antigas (tema escuro) para a paleta atual
  const OLD = { '#7c5cff': COLORS[0], '#22d3ee': COLORS[1], '#34d399': COLORS[2], '#fbbf24': COLORS[3], '#fb7185': COLORS[4], '#f97316': COLORS[5], '#a3e635': COLORS[6], '#e879f9': COLORS[7] };

  let state;

  function blankCard(over = {}) {
    return Object.assign({
      id: uid(), title: '', desc: '', subject: '', priority: 2,
      important: false, urgent: false, frog: false, due: '', est: 2, pomos: 0,
      checklist: [], tags: [],
      cornell: { cue: '', notes: '', summary: '' },
      feynman: { explain: '', gaps: '', simple: '' },
      srs: null, done: false, completedAt: null, created: Date.now()
    }, over);
  }

  function seed() {
    const subjects = [
      { id: 's1', name: 'Matemática', color: COLORS[0] },
      { id: 's2', name: 'Programação', color: COLORS[1] },
      { id: 's3', name: 'Inglês', color: COLORS[2] },
      { id: 's4', name: 'Física', color: COLORS[3] }
    ];
    const cols = ['Backlog', 'Para estudar', 'Estudando', 'Revisar', 'Concluído']
      .map((n, i) => ({ id: uid(), name: n, done: i === 4, cards: [] }));
    const board = { id: uid(), name: 'Meu estudo', columns: cols };
    const cards = {};
    const add = (ci, over) => { const c = blankCard(over); cards[c.id] = c; cols[ci].cards.push(c.id); return c; };
    add(0, { title: 'Cálculo II — integrais por partes', subject: 's1', priority: 3, important: true, est: 4, tags: ['recall'] });
    add(0, { title: 'Ler artigo sobre Clean Architecture', subject: 's2', priority: 1, est: 2, tags: ['sq3r'] });
    add(1, { title: 'Lista de exercícios de Física (cap. 5)', subject: 's4', priority: 3, urgent: true, important: true, due: addDays(today(), 2), est: 3, tags: ['pomodoro'], frog: true,
      checklist: [{ t: 'Questões 1–10', d: false }, { t: 'Questões 11–20', d: false }, { t: 'Revisar erros', d: false }] });
    add(1, { title: 'Vocabulário: phrasal verbs', subject: 's3', priority: 2, est: 1, tags: ['spaced'] });
    add(2, { title: 'Projeto: API REST em Node', subject: 's2', priority: 2, important: true, est: 5, tags: ['kanban', 'feynman'] });
    add(4, { title: 'Revisão de álgebra linear', subject: 's1', priority: 2, est: 2, done: true, completedAt: Date.now() });
    const flash = [
      { id: uid(), subject: 's2', front: 'O que é uma closure em JavaScript?', back: 'Função que "lembra" o escopo em que foi criada, mesmo executada fora dele.', box: 0, next: today() },
      { id: uid(), subject: 's1', front: 'Fórmula da integração por partes', back: '∫u dv = u·v − ∫v du', box: 0, next: today() },
      { id: uid(), subject: 's3', front: '"Give up"', back: 'Desistir', box: 0, next: today() }
    ];
    return {
      v: 1, boards: [board], activeBoard: board.id, cards, subjects, blocks: [], flash,
      sessions: [], reviewLog: [],
      settings: { pomo: { focus: 25, short: 5, long: 15, cycles: 4 } }
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? JSON.parse(raw) : seed();
    } catch (e) { state = seed(); }
    state.settings = state.settings || { pomo: { focus: 25, short: 5, long: 15, cycles: 4 } };
    state.reviewLog = state.reviewLog || [];
    state.sessions = state.sessions || [];
    state.blocks = state.blocks || [];
    state.flash = state.flash || [];
    (state.subjects || []).forEach(x => { if (OLD[x.color]) x.color = OLD[x.color]; });
    if (!state.boards.find(b => b.id === state.activeBoard)) state.activeBoard = state.boards[0].id;
    save();
  }

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage cheio/bloqueado */ } }
  const get = () => state;
  const board = () => state.boards.find(b => b.id === state.activeBoard);
  const subj = id => state.subjects.find(s => s.id === id);

  function addBoard(name, colDefs) {
    const b = {
      id: uid(), name,
      columns: (colDefs || [{ name: 'A fazer' }, { name: 'Fazendo' }, { name: 'Feito', done: true }])
        .map(c => ({ id: uid(), name: c.name, done: !!c.done, cards: [] }))
    };
    state.boards.push(b); state.activeBoard = b.id; save(); return b;
  }

  function removeBoard(id) {
    if (state.boards.length < 2) return false;
    const b = state.boards.find(x => x.id === id);
    b.columns.forEach(c => c.cards.forEach(cid => delete state.cards[cid]));
    state.boards = state.boards.filter(x => x.id !== id);
    if (state.activeBoard === id) state.activeBoard = state.boards[0].id;
    save(); return true;
  }

  function addCard(colId, title, over = {}) {
    const col = board().columns.find(c => c.id === colId) || board().columns[0];
    const c = blankCard(Object.assign({ title, done: !!col.done }, over));
    state.cards[c.id] = c; col.cards.push(c.id); save(); return c;
  }

  function findCol(cardId) {
    for (const b of state.boards) for (const c of b.columns) if (c.cards.includes(cardId)) return { b, c };
    return null;
  }

  function moveCard(id, colId, index) {
    const f = findCol(id); if (!f) return;
    const target = f.b.columns.find(c => c.id === colId); if (!target) return;
    f.c.cards = f.c.cards.filter(x => x !== id);
    const i = index == null ? target.cards.length : Math.max(0, Math.min(index, target.cards.length));
    target.cards.splice(i, 0, id);
    const card = state.cards[id];
    card.done = !!target.done;
    card.completedAt = card.done ? (card.completedAt || Date.now()) : null;
    save();
  }

  function removeCard(id) {
    const f = findCol(id); if (f) f.c.cards = f.c.cards.filter(x => x !== id);
    delete state.cards[id];
    state.blocks.forEach(b => { if (b.cardId === id) b.cardId = null; });
    save();
  }

  function addSubject(name) {
    const s = { id: uid(), name, color: COLORS[state.subjects.length % COLORS.length] };
    state.subjects.push(s); save(); return s;
  }

  // rating: 'again' | 'hard' | 'good'
  function nextReview(stage, rating) {
    let st = stage;
    if (rating === 'again') st = 0;
    else if (rating === 'good') st = Math.min(stage + 1, INTERVALS.length - 1);
    return { stage: st, next: addDays(today(), INTERVALS[st]) };
  }

  function logSession(min, subject, cardId) {
    state.sessions.push({ ts: Date.now(), date: today(), min, subject: subject || '', cardId: cardId || null });
    save();
  }

  function activityByDate() {
    const m = {};
    state.sessions.forEach(s => { m[s.date] = (m[s.date] || 0) + s.min; });
    state.reviewLog.forEach(d => { m[d] = (m[d] || 0) + 2; });
    return m;
  }

  function exportJSON() { return JSON.stringify(state, null, 2); }
  function importJSON(txt) {
    const o = JSON.parse(txt);
    if (!o || !o.boards || !o.cards) throw new Error('Arquivo inválido');
    state = o; load(); return true;
  }
  function reset() { state = seed(); save(); }

  load();
  return {
    get, save, board, subj, uid, today, addDays, iso, pad, INTERVALS, COLORS,
    addBoard, removeBoard, addCard, moveCard, removeCard, findCol, addSubject,
    nextReview, logSession, activityByDate, exportJSON, importJSON, reset, blankCard
  };
})();

  <script>
/* StudyFlow — interface e comportamento */
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const st = () => Store.get();
  const ui = { view: 'board', search: '', weekOffset: 0, revTab: 'cards', flashShow: false };
  const DAYS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
  const PRIOS = ['', 'Baixa', 'Média', 'Alta', 'Crítica'];
  const NAV = [
    { id: 'board', ic: '📋', lbl: 'Quadro' }, { id: 'schedule', ic: '🗓️', lbl: 'Cronograma' },
    { id: 'pomodoro', ic: '🍅', lbl: 'Pomodoro' }, { id: 'eisenhower', ic: '🎯', lbl: 'Prioridades' },
    { id: 'review', ic: '🔁', lbl: 'Revisão' }, { id: 'stats', ic: '📊', lbl: 'Progresso' },
    { id: 'methods', ic: '🧭', lbl: 'Métodos' }
  ];
  const fmtT = m => `${Store.pad(Math.floor(m / 60))}:${Store.pad(m % 60)}`;
  const fmtMin = m => m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}min` : `${m} min`;
  const fmtDate = iso => { const p = iso.split('-'); return `${p[2]}/${p[1]}`; };
  const mmss = s => `${Store.pad(Math.floor(s / 60))}:${Store.pad(s % 60)}`;

  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
  }

  /* ---------- modal ---------- */
  function openModal(html, cls = '', onClose) {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="modal ${cls}">${html}</div>`;
    const close = () => { if (!ov.isConnected) return; ov.remove(); if (onClose) onClose(); };
    ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
    ov._close = close; $('#modalRoot').appendChild(ov);
    return { el: ov.firstElementChild, close };
  }
  function closeTopModal() { const o = $$('.overlay').pop(); if (o) o._close(); }

  function ask(title, val = '', ph = '') {
    return new Promise(res => {
      let done = false;
      const { el, close } = openModal(`<h2>${esc(title)}</h2>
        <input type="text" id="askIn" value="${esc(val)}" placeholder="${esc(ph)}" style="margin-top:12px">
        <div class="foot"><span></span><div class="r"><button class="ghost" data-x="c">Cancelar</button><button class="primary" data-x="o">OK</button></div></div>`,
        'sm', () => { if (!done) res(null); });
      const inp = $('#askIn', el); inp.focus(); inp.select();
      const ok = () => { done = true; const v = inp.value.trim(); close(); res(v || null); };
      el.addEventListener('click', e => { const x = e.target.dataset.x; if (x === 'o') ok(); if (x === 'c') close(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
    });
  }

  /* ---------- timer (Pomodoro) ---------- */
  const T = { mode: 'focus', running: false, endAt: 0, left: null, cycle: 0, cardId: '' };
  const pset = () => st().settings.pomo;
  const modeDur = m => pset()[m === 'focus' ? 'focus' : m === 'short' ? 'short' : 'long'] * 60;
  const tLeft = () => T.running ? Math.max(0, Math.round((T.endAt - Date.now()) / 1000)) : (T.left == null ? modeDur(T.mode) : T.left);
  const MODE_LBL = { focus: 'Foco', short: 'Pausa curta', long: 'Pausa longa' };

  function beep() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25, 0.5].forEach(d => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.15, ac.currentTime + d); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d + 0.2);
        o.start(ac.currentTime + d); o.stop(ac.currentTime + d + 0.22);
      });
    } catch (e) { /* sem áudio */ }
  }
  function tStart() {
    if (T.running) return;
    T.left = tLeft(); T.endAt = Date.now() + T.left * 1000; T.running = true;
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    render();
  }
  function tPause() { T.left = tLeft(); T.running = false; render(); }
  function tReset() { T.running = false; T.left = null; render(); }
  function tMode(m) { T.mode = m; T.running = false; T.left = null; render(); }
  function tDone(silent) {
    T.running = false; T.left = null;
    if (!silent) beep();
    let msg;
    if (T.mode === 'focus') {
      const card = st().cards[T.cardId];
      if (!silent) {
        Store.logSession(pset().focus, card && card.subject, card && card.id);
        if (card) { card.pomos++; Store.save(); }
        T.cycle++;
      }
      T.mode = T.cycle % pset().cycles === 0 ? 'long' : 'short';
      msg = '🍅 Foco concluído! Hora da pausa.';
    } else { T.mode = 'focus'; msg = '⏰ Pausa terminada. Bora focar!'; }
    toast(msg);
    if ('Notification' in window && Notification.permission === 'granted' && !silent) new Notification('StudyFlow', { body: msg });
    render();
  }
  function tickDom() {
    const left = tLeft();
    const total = modeDur(T.mode);
    const tt = $('#tTime'); if (tt) tt.textContent = mmss(left);
    const ring = $('#tRing'); if (ring) ring.style.strokeDashoffset = String(753.98 * (1 - left / total));
    const mini = $('#miniTimer');
    const active = T.running || T.left != null;
    mini.hidden = !active;
    if (active) mini.innerHTML = `<div class="l">${MODE_LBL[T.mode]}${T.running ? '' : ' · pausado'}</div><div class="t">${mmss(left)}</div>`;
    document.title = T.running ? `${mmss(left)} · StudyFlow` : 'StudyFlow — organize seus estudos';
  }
  setInterval(() => { if (T.running && tLeft() <= 0) tDone(); tickDom(); }, 500);

  /* ---------- helpers de cartão ---------- */
  function dueChip(c) {
    if (!c.due) return '';
    const diff = Math.round((new Date(c.due + 'T12:00:00') - new Date(Store.today() + 'T12:00:00')) / 864e5);
    const cls = c.done ? 'ok' : diff < 0 ? 'late' : diff <= 2 ? 'soon' : '';
    return `<span class="chip ${cls}">📅 ${fmtDate(c.due)}</span>`;
  }
  function cardHTML(c) {
    const s = Store.subj(c.subject);
    const d = c.checklist.filter(i => i.d).length, n = c.checklist.length;
    const tags = c.tags.map(t => (Methods.byId(t) || {}).icon).filter(Boolean).join(' ');
    return `<article class="card ${c.done ? 'done' : ''}" draggable="true" data-id="${c.id}">
      <div class="row">
        <span class="prio p${c.priority}" title="Prioridade ${PRIOS[c.priority]}"></span>
        ${s ? `<span class="chip subj" style="background:${s.color}33;color:${s.color}">${esc(s.name)}</span>` : ''}
        ${c.frog ? '<span title="Eat the frog">🐸</span>' : ''}
        ${c.srs ? '<span title="Em revisão espaçada">🔁</span>' : ''}
      </div>
      <div class="ttl">${esc(c.title)}</div>
      <div class="row">
        ${dueChip(c)}
        ${n ? `<span class="chip">☑ ${d}/${n}</span>` : ''}
        ${c.est ? `<span class="chip">🍅 ${c.pomos}/${c.est}</span>` : ''}
        ${tags ? `<span class="chip">${tags}</span>` : ''}
      </div>
      ${n ? `<div class="progress"><i style="width:${Math.round(d / n * 100)}%"></i></div>` : ''}
    </article>`;
  }
  const matches = c => !ui.search || (c.title + ' ' + c.desc).toLowerCase().includes(ui.search);
  const boardCards = () => Store.board().columns.flatMap(col => col.cards.map(id => st().cards[id]).filter(Boolean));
  const dueReviews = () => Object.values(st().cards).filter(c => c.srs && c.srs.next <= Store.today());
  const dueFlash = () => st().flash.filter(f => f.next <= Store.today());

  /* ---------- views ---------- */
  function vBoard() {
    const b = Store.board();
    const cols = b.columns.map(col => {
      const cards = col.cards.map(id => st().cards[id]).filter(c => c && matches(c));
      return `<section class="col ${col.done ? 'done-col' : ''}">
        <header><h3>${esc(col.name)}</h3><span class="count">${cards.length}</span>
          <button class="icon" data-act="col-menu" data-col="${col.id}" title="Opções da lista">⋯</button></header>
        <div class="cards" data-drop="${col.id}" data-drop-kind="col">${cards.map(cardHTML).join('')}</div>
        <button class="add" data-act="add-card" data-col="${col.id}">＋ Adicionar cartão</button>
      </section>`;
    }).join('');
    return `<div class="board">${cols}<button class="col add-col" data-act="add-col">＋ Nova lista</button></div>`;
  }

  function weekStart(off) {
    const d = new Date(); d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + off * 7); return d;
  }
  const START_H = 6, ROW = 48;
  function vSchedule() {
    const ws = weekStart(ui.weekOffset), todayIso = Store.today();
    const days = [...Array(7)].map((_, i) => { const d = new Date(ws); d.setDate(ws.getDate() + i); return d; });
    const range = `${fmtDate(Store.iso(days[0]))} – ${fmtDate(Store.iso(days[6]))}`;
    const heads = days.map((d, i) => `<div class="head ${Store.iso(d) === todayIso ? 'today' : ''}">${DAYS[i]}<b>${d.getDate()}</b></div>`).join('');
    const hours = [...Array(24 - START_H)].map((_, i) => `<div>${Store.pad(START_H + i)}:00</div>`).join('');
    const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
    const cols = days.map(d => {
      const iso = Store.iso(d);
      const blocks = st().blocks.filter(b => b.date === iso).map(b => {
        const s = Store.subj(b.subject), color = s ? s.color : '#4a6fa5';
        const top = Math.max(0, (b.start - START_H * 60) / 60 * ROW);
        return `<div class="block" data-block="${b.id}" style="top:${top}px;height:${Math.max(22, b.dur / 60 * ROW - 2)}px;background:${color}d9">

  function vStats() {
    const s = st(), act = Store.activityByDate(), today = Store.today();
    const totalMin = s.sessions.reduce((a, x) => a + x.min, 0);
    let streak = 0, d = act[today] ? today : Store.addDays(today, -1);
    while (act[d]) { streak++; d = Store.addDays(d, -1); }
    const doneCount = Object.values(s.cards).filter(c => c.done).length, all = Object.keys(s.cards).length;
    const last14 = [...Array(14)].map((_, i) => Store.addDays(today, i - 13));
    const vals = last14.map(x => s.sessions.filter(y => y.date === x).reduce((a, y) => a + y.min, 0));
    const max = Math.max(30, ...vals);
    const bySub = {};
    s.sessions.forEach(x => { bySub[x.subject || ''] = (bySub[x.subject || ''] || 0) + x.min; });
    const subRows = Object.entries(bySub).sort((a, b) => b[1] - a[1]);
    const maxSub = Math.max(1, ...subRows.map(r => r[1]));
    const ws = weekStart(-11);
    const cells = [...Array(84)].map((_, i) => {
      const dt = new Date(ws); dt.setDate(ws.getDate() + i); const iso = Store.iso(dt), m = act[iso] || 0;
      const lv = iso > today ? '' : m === 0 ? '' : m <= 25 ? 'l1' : m <= 60 ? 'l2' : m <= 120 ? 'l3' : 'l4';
      return `<i class="${lv}" title="${fmtDate(iso)} · ${m} min" ${iso > today ? 'style="opacity:.25"' : ''}></i>`;
    }).join('');
    return `<div class="toolbar"><h2>Progresso</h2></div>
      <div class="stats">
        <div class="stat"><b>${fmtMin(vals[13])}</b><span>Foco hoje</span></div>
        <div class="stat"><b>${fmtMin(totalMin)}</b><span>Foco total</span></div>
        <div class="stat"><b>🔥 ${streak}</b><span>Dias seguidos</span></div>
        <div class="stat"><b>${doneCount}/${all}</b><span>Cartões concluídos</span></div>
        <div class="stat"><b>${s.reviewLog.length}</b><span>Revisões feitas</span></div>
      </div>
      <div class="grid2">
        <div class="glass"><b>Últimos 14 dias</b><div class="bars">${last14.map((x, i) => `<div title="${fmtMin(vals[i])}"><i style="height:${vals[i] / max * 100}%"></i>${x.slice(8)}</div>`).join('')}</div></div>
        <div class="glass"><b>Tempo por matéria</b>${subRows.length ? subRows.map(([id, m]) => { const sb = Store.subj(id); return `<div class="hbar"><div class="t"><span>${sb ? esc(sb.name) : 'Sem matéria'}</span><span>${fmtMin(m)}</span></div><div class="b"><i style="width:${m / maxSub * 100}%;background:${sb ? sb.color : '#9a9c9f'}"></i></div></div>`; }).join('') : '<p class="hint" style="margin-top:10px">Conclua ciclos Pomodoro para ver os dados.</p>'}</div>
      </div>
      <div class="glass" style="margin-top:14px"><b>Constância (12 semanas)</b><div class="heat">${cells}</div></div>`;
  }

      const t = e.target;
      if (t.dataset.ci != null) { c.checklist[+t.dataset.ci].d = t.checked; Store.save(); renderCL(); return; }
      if (t.dataset.tag) { c.tags = t.checked ? [...new Set([...c.tags, t.dataset.tag])] : c.tags.filter(x => x !== t.dataset.tag); Store.save(); return; }
      if (t.dataset.colmove != null) { Store.moveCard(id, t.value); return; }
      if (t.dataset.bind) {
        if (t.id === 'subjSel' && t.value === '__new') {
          const name = await ask('Nova matéria', '', 'Ex.: Química');
          if (name) { c.subject = Store.addSubject(name).id; Store.save(); }
          t.innerHTML = subjOpts(); return;
        }
        let v = t.type === 'checkbox' ? t.checked : t.value;
        if (t.hasAttribute('data-num')) v = Number(v) || 0;
        setPath(c, t.dataset.bind, v); Store.save();
      }
    };
    el.addEventListener('input', e => { if (e.target.dataset.bind && e.target.tagName !== 'SELECT' && e.target.type !== 'checkbox') onChange(e); });
    el.addEventListener('change', onChange);
  }

  /* ---------- modal de bloco ---------- */
  function openBlock(id, pre = {}) {
    const s = st(), b = id ? s.blocks.find(x => x.id === id) : null;
    const v = b || Object.assign({ title: '', subject: '', cardId: '', date: Store.today(), start: 9 * 60, dur: 60 }, pre);
    const cards = Object.values(s.cards).filter(c => !c.done);
    const { el, close } = openModal(`<h2>${b ? 'Editar bloco' : 'Novo bloco de estudo'}</h2>
      <label class="lbl">Título</label><input type="text" id="bT" value="${esc(v.title)}" placeholder="O que vai estudar?">
      <div class="cols2"><div><label class="lbl">Matéria</label><select id="bS"><option value="">—</option>${s.subjects.map(x => `<option value="${x.id}" ${x.id === v.subject ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
        <div><label class="lbl">Vincular a cartão</label><select id="bC"><option value="">—</option>${cards.map(x => `<option value="${x.id}" ${x.id === v.cardId ? 'selected' : ''}>${esc(x.title)}</option>`).join('')}</select></div></div>
      <div class="cols3"><div><label class="lbl">Data</label><input type="date" id="bD" value="${v.date}"></div>
        <div><label class="lbl">Início</label><input type="time" id="bH" value="${fmtT(v.start)}"></div>
        <div><label class="lbl">Duração (min)</label><input type="number" id="bM" min="15" step="15" value="${v.dur}"></div></div>
      <div class="foot">${b ? '<button class="danger" id="bDel">Excluir</button>' : '<span></span>'}<div class="r"><button class="ghost" id="bX">Cancelar</button><button class="primary" id="bOk">Salvar</button></div></div>`, 'sm', () => render());
    $('#bC', el).addEventListener('change', e => {
      const c = s.cards[e.target.value]; if (!c) return;
      if (!$('#bT', el).value.trim()) $('#bT', el).value = c.title;
      if (c.subject) $('#bS', el).value = c.subject;
    });
    el.addEventListener('click', e => {
      const t = e.target.id;
      if (t === 'bX') close();
      if (t === 'bDel') { s.blocks = s.blocks.filter(x => x.id !== id); Store.save(); close(); }
      if (t === 'bOk') {
        const title = $('#bT', el).value.trim(); if (!title) { $('#bT', el).focus(); return; }
        const [h, m] = ($('#bH', el).value || '09:00').split(':').map(Number);
        const data = { title, subject: $('#bS', el).value, cardId: $('#bC', el).value, date: $('#bD', el).value || Store.today(), start: h * 60 + m, dur: Math.max(15, Number($('#bM', el).value) || 60) };
        if (b) Object.assign(b, data); else s.blocks.push(Object.assign({ id: Store.uid() }, data));
        Store.save(); close();
      }
    });
  }

  function autoPlan() {
    const s = st(), todayIso = Store.today(), now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
    const WIN = [[8 * 60, 12 * 60], [14 * 60, 18 * 60], [19 * 60, 22 * 60]];
    const cands = Object.values(s.cards).filter(c => !c.done && c.est > c.pomos && !s.blocks.some(b => b.cardId === c.id && b.date >= todayIso))
      .sort((a, b) => (Number(b.frog) - Number(a.frog)) || (a.due || '9999').localeCompare(b.due || '9999') || b.priority - a.priority);
    let created = 0;
    for (const c of cands) {
      const need = Math.min((c.est - c.pomos) * 30, 120);
      let placed = false;
      for (let d = 0; d < 7 && !placed; d++) {
        const date = Store.addDays(todayIso, d);
        if (c.due && date > c.due && d > 0) break;
        const day = s.blocks.filter(b => b.date === date);
        if (day.reduce((a, b) => a + b.dur, 0) >= 300) continue;
        for (const [ws, we] of WIN) {
          for (let t = ws; t + need <= we && !placed; t += 15) {
            if (d === 0 && t < nowMin + 15) continue;
            if (day.some(b => t < b.start + b.dur + 10 && t + need + 10 > b.start)) continue;
            s.blocks.push({ id: Store.uid(), date, start: t, dur: need, title: c.title, subject: c.subject, cardId: c.id });
            placed = true; created++;
          }
          if (placed) break;
        }
      }
    }
    Store.save(); ui.weekOffset = 0; render();
    toast(created ? `✨ ${created} bloco(s) criado(s) automaticamente` : 'Nada para planejar (sem cartões com estimativa pendente)');
  }

  /* ---------- modelos de quadro ---------- */
  function newBoardModal() {
    const opts = [{ id: '', name: 'Em branco', icon: '📄', template: null }, ...Methods.LIST.filter(m => m.template)];
    const { el, close } = openModal(`<h2>Novo quadro</h2>
      <label class="lbl">Nome</label><input type="text" id="nbN" placeholder="Ex.: Prova de Cálculo">
      <label class="lbl">Modelo</label>
      ${opts.map((m, i) => `<label class="list-item" style="cursor:pointer"><input type="radio" name="tpl" value="${m.id}" ${i === 0 ? 'checked' : ''}><span style="font-size:18px">${m.icon}</span><div class="grow"><b>${esc(m.name)}</b><div class="hint">${m.template ? m.template.map(c => esc(c.name)).join(' → ') : 'A fazer → Fazendo → Feito'}</div></div></label>`).join('')}
      <div class="foot"><span></span><div class="r"><button class="ghost" id="nbX">Cancelar</button><button class="primary" id="nbOk">Criar</button></div></div>`);
    el.addEventListener('click', e => {
      if (e.target.id === 'nbX') close();
      if (e.target.id === 'nbOk') {
        const tpl = ($('input[name=tpl]:checked', el) || {}).value, m = Methods.byId(tpl);
        Store.addBoard($('#nbN', el).value.trim() || (m ? m.name : 'Novo quadro'), m ? m.template : null);
        close(); go('board');
      }
    });
  }

  async function colMenu(colId) {
    const b = Store.board(), col = b.columns.find(c => c.id === colId);
    const { el, close } = openModal(`<h2>${esc(col.name)}</h2>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
        <button class="ghost" data-x="ren">✎ Renomear lista</button>
        <button class="ghost" data-x="done">${col.done ? '☐ Deixar de marcar como "concluído"' : '✓ Marcar como lista de concluídos'}</button>
        <button class="ghost" data-x="left">← Mover para a esquerda</button><button class="ghost" data-x="right">→ Mover para a direita</button>
        <button class="danger" data-x="del">🗑 Excluir lista</button></div>`, 'sm');
    el.addEventListener('click', async e => {
      const x = e.target.dataset.x; if (!x) return;
      const i = b.columns.indexOf(col);
      if (x === 'ren') { close(); const n = await ask('Renomear lista', col.name); if (n) { col.name = n; Store.save(); render(); } return; }
      if (x === 'done') { col.done = !col.done; col.cards.forEach(id => { const c = st().cards[id]; c.done = col.done; c.completedAt = col.done ? (c.completedAt || Date.now()) : null; }); }
      if (x === 'left' && i > 0) [b.columns[i - 1], b.columns[i]] = [b.columns[i], b.columns[i - 1]];
      if (x === 'right' && i < b.columns.length - 1) [b.columns[i + 1], b.columns[i]] = [b.columns[i], b.columns[i + 1]];
      if (x === 'del') {
        if (b.columns.length < 2) { toast('O quadro precisa de ao menos uma lista'); return; }
        if (!confirm('Excluir lista? Os cartões vão para outra lista.')) return;
        const other = b.columns.find(c => c !== col);
        other.cards.push(...col.cards); col.cards.forEach(id => { st().cards[id].done = !!other.done; });
        b.columns = b.columns.filter(c => c !== col);
      }
      Store.save(); close(); render();
    });
  }

  /* ---------- ações ---------- */
  const A = {
    'quick-add': () => {
      go('board');
      const col = Store.board().columns.find(c => !c.done) || Store.board().columns[0];
      const c = Store.addCard(col.id, 'Novo cartão'); render(); openCard(c.id);
    },
    'add-card': el => {
      const box = document.createElement('div'); box.className = 'inline-add'; box.dataset.col = el.dataset.col;
      box.innerHTML = '<textarea rows="2" placeholder="Título do cartão…"></textarea><div style="display:flex;gap:6px"><button class="primary" data-act="inline-save">Adicionar</button><button class="ghost" data-act="inline-cancel">Cancelar</button></div>';
      el.replaceWith(box);
      const ta = $('textarea', box); ta.focus();
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); A['inline-save'](box); }
        if (e.key === 'Escape') { e.stopPropagation(); render(); }
      });
    },
    'inline-save': el => {
      const box = el.closest('.inline-add'), v = $('textarea', box).value.trim();
      if (v) { Store.addCard(box.dataset.col, v); toast('Cartão criado'); }
      render();
      if (v) { const b = $(`[data-act="add-card"][data-col="${box.dataset.col}"]`); if (b) b.click(); }
    },
    'inline-cancel': () => render(),
    'add-col': async () => { const n = await ask('Nova lista', '', 'Ex.: Em revisão'); if (n) { Store.board().columns.push({ id: Store.uid(), name: n, done: false, cards: [] }); Store.save(); render(); } },
    'col-menu': el => colMenu(el.dataset.col),
    'new-board': () => newBoardModal(),
    'rename-board': async () => { const b = Store.board(), n = await ask('Renomear quadro', b.name); if (n) { b.name = n; Store.save(); render(); } },
    'del-board': () => { const b = Store.board(); if (st().boards.length < 2) return toast('Mantenha ao menos um quadro'); if (confirm(`Excluir o quadro "${b.name}" e seus cartões?`)) { Store.removeBoard(b.id); render(); } },
    'week-prev': () => { ui.weekOffset--; render(); }, 'week-next': () => { ui.weekOffset++; render(); }, 'week-today': () => { ui.weekOffset = 0; render(); },
    'add-block': () => openBlock(null), 'auto-plan': autoPlan,
    't-start': tStart, 't-pause': tPause, 't-reset': tReset, 't-skip': () => tDone(true),
    't-mode': el => tMode(el.dataset.m),
    't-preset': el => { const [f, s, l] = el.dataset.p.split(',').map(Number); Object.assign(pset(), { focus: f, short: s, long: l }); Store.save(); T.left = null; render(); },
    'rev-tab': el => { ui.revTab = el.dataset.t; ui.flashShow = false; render(); },
    'rev': el => {
      const c = st().cards[el.dataset.id], r = Store.nextReview(c.srs.stage, el.dataset.r);
      c.srs.stage = r.stage; c.srs.next = r.next; st().reviewLog.push(Store.today()); Store.save(); render();
      toast(`Próxima revisão: ${fmtDate(r.next)}`);
    },
    'flash-show': () => { ui.flashShow = true; render(); },
    'flash-rate': el => {
      const f = st().flash.find(x => x.id === el.dataset.id), r = Store.nextReview(f.box, el.dataset.r);
      f.box = r.stage; f.next = r.next; st().reviewLog.push(Store.today()); Store.save(); ui.flashShow = false; render();
    },
    'flash-add': () => {
      const fr = $('#fcFront').value.trim(), bk = $('#fcBack').value.trim();
      if (!fr || !bk) return toast('Preencha pergunta e resposta');
      st().flash.push({ id: Store.uid(), subject: $('#fcSubj').value, front: fr, back: bk, box: 0, next: Store.today() }); Store.save(); render(); toast('Flashcard adicionado');
    },
    'flash-del': el => { st().flash = st().flash.filter(x => x.id !== el.dataset.id); Store.save(); render(); },
    'm-view': el => go(el.dataset.v),
    'm-open': el => { go('board'); toast(el.dataset.m === 'frog' ? 'Abra um cartão e marque 🐸 Sapo do dia' : `Abra um cartão e use a aba ${el.dataset.m === 'cornell' ? 'Cornell' : 'Feynman'}`); },
    'm-template': el => { const m = Methods.byId(el.dataset.m); Store.addBoard(`${m.name} — modelo`, m.template); go('board'); toast(`Quadro "${m.name}" criado`); },
    'export': () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([Store.exportJSON()], { type: 'application/json' }));
      a.download = `studyflow-backup-${Store.today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
    'import': () => $('#importFile').click()
  };

  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-view]'); if (nav) return go(nav.dataset.view);
    if (e.target.closest('#miniTimer')) return go('pomodoro');
    const act = e.target.closest('[data-act]'); if (act && A[act.dataset.act]) return A[act.dataset.act](act);
    const op = e.target.closest('[data-open]'); if (op) return openCard(op.dataset.open);
    const blk = e.target.closest('[data-block]'); if (blk) return openBlock(blk.dataset.block);
    const card = e.target.closest('.card[data-id]'); if (card) return openCard(card.dataset.id);
    const col = e.target.closest('.daycol');
    if (col) {
      const y = e.clientY - col.getBoundingClientRect().top;
      const start = START_H * 60 + Math.floor(y / ROW * 4) * 15;
      openBlock(null, { date: col.dataset.date, start: Math.min(start, 22 * 60) });
    }
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'boardSel') { st().activeBoard = t.value; Store.save(); render(); }
    if (t.dataset.pcard != null) T.cardId = t.value;
    if (t.dataset.pset) { const v = Math.max(1, Math.min(180, Number(t.value) || 1)); pset()[t.dataset.pset] = v; Store.save(); T.left = null; render(); }
    if (t.id === 'importFile' && t.files[0]) {
      const r = new FileReader();
      r.onload = () => { try { Store.importJSON(r.result); render(); toast('Backup importado ✔'); } catch (err) { toast('Arquivo inválido'); } };
      r.readAsText(t.files[0]); t.value = '';
    }
  });
  $('#search').addEventListener('input', e => { ui.search = e.target.value.trim().toLowerCase(); if (ui.view === 'board' || ui.view === 'eisenhower') render(); });

  /* ---------- arrastar e soltar ---------- */
  let dragId = null;
  document.addEventListener('dragstart', e => {
    const c = e.target.closest && e.target.closest('.card[data-id]'); if (!c) return;
    dragId = c.dataset.id; c.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
  });
  document.addEventListener('dragend', () => { dragId = null; $$('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')); });
  document.addEventListener('dragover', e => {
    const z = e.target.closest && e.target.closest('[data-drop]'); if (!z || !dragId) return;
    e.preventDefault(); $$('.over').forEach(x => { if (x !== z) x.classList.remove('over'); }); z.classList.add('over');
  });
  document.addEventListener('drop', e => {
    const z = e.target.closest && e.target.closest('[data-drop]'); if (!z || !dragId) return;
    e.preventDefault(); const id = dragId; dragId = null;
    if (z.dataset.dropKind === 'quad') {
      const q = QUADS.find(x => x.id === z.dataset.drop), c = st().cards[id];
      c.important = q.imp; c.urgent = q.urg; Store.save();
    } else {
      const col = Store.board().columns.find(c => c.id === z.dataset.drop);
      const vis = $$('.card[data-id]', z).filter(x => x.dataset.id !== id);
      let idx = vis.length;
      for (let i = 0; i < vis.length; i++) { const r = vis[i].getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { idx = i; break; } }
      const rest = col.cards.filter(x => x !== id);
      const at = idx < vis.length ? rest.indexOf(vis[idx].dataset.id) : rest.length;
      Store.moveCard(id, col.id, at < 0 ? rest.length : at);
    }
    render();
  });

  /* ---------- atalhos ---------- */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') return closeTopModal();
    const typing = /INPUT|TEXTAREA|SELECT/.test((e.target.tagName || '')) || $('.overlay');
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); $('#search').focus(); }
    else if (e.key === 'n') A['quick-add']();
    else if (/^[1-7]$/.test(e.key)) go(NAV[+e.key - 1].id);
  });

  render();
})();

</script>
</body>
